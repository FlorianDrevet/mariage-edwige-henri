name: Trigger auto deployment for aca-frontend-weh

on:
  push:
    branches:
      [ main ]
    paths:
    - 'src/front/**'
    - '.github/workflows/aca-frontend-weh.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      REGISTRY_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
      CONTAINER_APP_NAME: aca-frontend-weh
      RESOURCE_GROUP: rg-wedding-edwige-henri
      IMAGE_NAME: aca-frontend-weh
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ACR_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate deployment settings
        shell: bash
        run: |
          if [ -z "${ACR_NAME}" ]; then
            echo "The ACR_NAME GitHub repository variable is missing or empty."
            exit 1
          fi

      - name: Install Container Apps extension
        shell: bash
        run: az extension add --name containerapp --upgrade --allow-preview true

      - name: Log in to the shared ACR with workload identity
        shell: bash
        run: az acr login --name "$ACR_NAME"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./src/front
          file: ./src/front/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Update Container App image
        shell: bash
        run: |
          az containerapp update \
            --name "${CONTAINER_APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${REGISTRY_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
